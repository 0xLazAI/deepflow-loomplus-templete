version: "1"
name: "deepflow"

params:
  openclaw_version:
    default: "2026.3.2"
  dev_agent_model:
    default: "openai/gpt-5.3-codex"
  coordinator_telegram_bot_key:
    required: false
    default: ""
  google_meeting_telegram_bot_key:
    required: false
    default: ""
  project_manager_telegram_bot_key:
    required: false
    default: ""
  knowledge_manager_telegram_bot_key:
    required: false
    default: ""
  demo_worker_telegram_bot_key:
    required: false
    default: ""
  auth_choice:
    default: "openai-api-key"
  allowed_origin:
    default: "http://deepflow.app"

openclaw:
  bin: "openclaw"
  version: "${openclaw_version}"
  commands:
    enable_plugin: "openclaw plugins enable telegram"
  config_patch:
    agents:
      defaults:
        pdfMaxBytesMb: 20
        pdfMaxPages: 50
    tools:
      media:
        image:
          maxBytes: 20971520
    models:
      providers:
        ollama:
          baseUrl: "http://127.0.0.1:11434"
          apiKey: "${openai_api_key}"
          api: "ollama"
          models:
            - id: "kimi-k2.5:cloud"
              name: "kimi-k2.5:cloud"
              reasoning: true
              input:
                - "text"
                - "image"
              cost:
                input: 0
                output: 0
                cacheRead: 0
                cacheWrite: 0
              contextWindow: 262144
    channels:
      telegram:
        mediaMaxMb: 20
        accounts:
          coordinator:
            dmPolicy: "open"
            allowFrom:
              - "*"
            groupPolicy: "open"
            streaming: "partial"
            actions:
              sendMessage: true
          google-meeting:
            dmPolicy: "open"
            allowFrom:
              - "*"
            groupPolicy: "open"
            streaming: "partial"
            actions:
              sendMessage: true
          project-manager:
            dmPolicy: "open"
            allowFrom:
              - "*"
            groupPolicy: "open"
            streaming: "partial"
            actions:
              sendMessage: true
          knowledge-manager:
            dmPolicy: "open"
            allowFrom:
              - "*"
            groupPolicy: "open"
            streaming: "partial"
            actions:
              sendMessage: true
          demo-worker:
            dmPolicy: "pairing"
            groupPolicy: "open"
            streaming: "partial"
            actions:
              sendMessage: true
    gateway:
      http:
        endpoints:
          responses:
            enabled: true
            files:
              allowedMimes:
                - "text/plain"
                - "text/markdown"
                - "text/html"
                - "text/csv"
                - "text/tab-separated-values"
                - "application/json"
                - "application/xml"
                - "text/xml"
                - "text/yaml"
                - "application/yaml"
                - "application/x-yaml"
                - "application/javascript"
                - "text/javascript"
                - "application/pdf"
              maxBytes: 20971520
              maxChars: 200000
              pdf:
                maxPages: 8
                maxPixels: 2000000
                minTextChars: 200
            images:
              maxBytes: 10485760
  root:
    assets: "./assets/root"
    files:
      - path: "openclaw.json"
        content: |
          {
            "tools": {
              "profile": "coding",
              "media": {
                "image": {
                  "maxBytes": 20971520
                }
              }
            },
            "gateway": {
              "mode": "local",
              "http": {
                "endpoints": {
                  "responses": {
                    "enabled": true,
                    "files": {
                      "allowedMimes": [
                        "text/plain",
                        "text/markdown",
                        "text/html",
                        "text/csv",
                        "text/tab-separated-values",
                        "application/json",
                        "application/xml",
                        "text/xml",
                        "text/yaml",
                        "application/yaml",
                        "application/x-yaml",
                        "application/javascript",
                        "text/javascript",
                        "application/pdf"
                      ],
                      "maxBytes": 20971520,
                      "maxChars": 200000,
                      "pdf": {
                        "maxPages": 8,
                        "maxPixels": 2000000,
                        "minTextChars": 200
                      }
                    },
                    "images": {
                      "maxBytes": 10485760
                    }
                  }
                }
              },
              "controlUi": {
                "allowedOrigins": ["${allowed_origin}"]
              }
            }
          }
  bootstrap:
    auth_choice: "${auth_choice}"
    llm_api_key: "${openai_api_key}"

workspaces:
  - name: "coordinator"
    assets: "./assets/coordinator"
  - name: "google-meeting"
    assets: "./assets/google-meeting"
  - name: "project-manager"
    assets: "./assets/project-manager"
  - name: "knowledge-manager"
    assets: "./assets/knowledge-manager"
  - name: "demo-worker"
    assets: "./assets/demo-worker"

agents:
  - workspace: "coordinator"
    name: "coordinator"
    model: "${dev_agent_model}"
  - workspace: "google-meeting"
    name: "google-meeting"
    model: "${dev_agent_model}"
  - workspace: "project-manager"
    name: "project-manager"
    model: "${dev_agent_model}"
  - workspace: "knowledge-manager"
    name: "knowledge-manager"
    model: "${dev_agent_model}"
  - workspace: "demo-worker"
    name: "demo-worker"
    model: "${dev_agent_model}"

channels:
  - channel: "telegram"
    token: "${coordinator_telegram_bot_key}"
    agent: "coordinator"
    group_policy: "open"
  - channel: "telegram"
    token: "${google_meeting_telegram_bot_key}"
    agent: "google-meeting"
    group_policy: "open"
  - channel: "telegram"
    token: "${project_manager_telegram_bot_key}"
    agent: "project-manager"
    group_policy: "open"
  - channel: "telegram"
    token: "${knowledge_manager_telegram_bot_key}"
    agent: "knowledge-manager"
    group_policy: "open"
  - channel: "telegram"
    token: "${demo_worker_telegram_bot_key}"
    agent: "demo-worker"
    group_policy: "open"
